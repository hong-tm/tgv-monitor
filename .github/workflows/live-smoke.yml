name: Live API smoke

# The offline suite stubs axios, so an upstream TGV API change is invisible to
# CI. This runs the read-only contract check daily; a failed run is the alert.
# GitHub disables scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: '17 2 * * *' # 10:17 Asia/Kuala_Lumpur, while same-day sessions are on sale
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  smoke:
    name: TGV boxoffice contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # worst case is two full attempts of 8s-timeout calls
    env:
      TGV_ENV_FILE: /dev/null
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the live TGV API contract
        run: npm run smoke:live
